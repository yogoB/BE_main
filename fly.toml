# Fly.io 배포 설정. `fly launch` 가 이 파일을 감지해 재사용한다.
# region nrt = 도쿄(한국에서 가장 가까움).
#
# app 이름 주의: 프론트(github.com/yogoB/Front)도 fly 앱을 쓴다. 이름이 같으면 나중에 배포한 쪽이
# 앞선 배포를 덮어쓴다(2026-09-16 실제로 프론트 배포가 BE 를 덮었다). BE 는 yogob-api,
# 프론트는 yogob 로 분리하고, 브라우저에는 프론트 오리진 하나만 노출한다
# (프론트 nginx 가 /api·/oauth2·/login/oauth2 를 이 앱으로 프록시 → 같은 오리진이라 쿠키·CORS 문제가 없다).
app = "yogob-api"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 으로 두면 안 된다. Fly 프록시는 깨운 머신의 8080 을 **8.3초**만 기다리다 포기하는데
  # Spring Boot 는 12~13초를 쓴다 — 쉬다가 들어온 첫 요청은 느린 게 아니라 **실패한다**
  # (2026-09-17 운영 로그: 04:48:21 Starting machine → 04:48:30 "gave up after 15 attempts" →
  #  04:48:36 Tomcat started). Google 로그인이 이걸 매번 밟는다: 사용자가 동의 화면에 머무는
  #  동안 BE 트래픽이 0 이라 머신이 멈추고(유휴 약 4분), 그 다음 요청이 하필 OAuth 콜백이다.
  #  게다가 OAuth 임시 세션은 인메모리라 재시작하면 state·PKCE 가 사라진다
  #  (google-oauth-guide.md §6 "로그인 중 자동 정지·재시작하지 않게 한다" — 이게 그 장치다).
  #  09:00 KST 일일 수집(backoffice.md)도 잠든 머신에서는 발화하지 않는다. 같은 한 줄이 고친다.
  min_machines_running = 1

  # 헬스체크: 액추에이터가 없으므로 항상 200 을 주는 카탈로그 엔드포인트로 확인한다(DB 연결까지 검증됨).
  # Spring Boot 콜드 스타트가 있으므로 grace_period 를 넉넉히 준다.
  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/catalog/services"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# 운영 지표(D-25). Fly 프로메테우스가 사설망(6PN)으로 9091 을 긁어 fly-metrics.net 그라파나에 그린다.
# 공개되는 서비스는 위 http_service(8080) 하나뿐이라 이 포트는 인터넷에서 닿지 않는다.
# 앱 쪽 포트는 application.properties 의 management.server.port(기본 9091)와 맞춰야 한다.
[metrics]
  port = 9091
  path = "/actuator/prometheus"
