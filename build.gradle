plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.palsaekjo'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources') {
    dependsOn 'goldenAuditStamp'
    from('db') {
        into 'db'
        include 'migration/*.sql', 'seed/*.csv', 'seed/dev/*.csv'
        exclude 'seed/*_TEMPLATE.csv'
    }
    from(layout.buildDirectory.dir('generated-resources'))
}

/*
 * 백오피스가 "계산 오류율"(최종보고서 §9.2 ②)을 말할 수 있게 골든 케이스 수를 빌드 산출물에 심는다.
 *
 * 이 지표는 **런타임 값이 아니다.** 정답셋과 어긋난 계산이 하나라도 있으면 `check` 가 실패해
 * 배포 자체가 막히므로, 운영에 떠 있는 빌드에서는 정의상 0 이다. 그러니 대시보드가 낼 수 있는
 * 것은 "얼마나 틀렸나"가 아니라 **"무엇이 몇 개를 지키고 있나"**다. 그 개수를 여기서 센다.
 *
 * 세는 곳은 docs/testing.md 한 곳이다 — 골든 케이스의 원본이고, 개수를 코드에 또 적으면 어긋난다.
 */
tasks.register('goldenAuditStamp') {
    def source = file('docs/testing.md')
    def target = layout.buildDirectory.file('generated-resources/golden-audit.properties')
    inputs.files(source)          // 없을 수도 있다 — file() 은 없으면 태스크가 실패한다
    outputs.file(target)
    doLast {
        def out = target.get().asFile
        out.parentFile.mkdirs()
        if (!source.exists()) {
            // 빌드 컨텍스트에 이 파일이 없을 수 있다. 그때는 **빈 스탬프**를 남기고 넘어간다 —
            // 대시보드가 개수를 null 로 내면 될 일이지 배포를 막을 일이 아니다.
            // (2026-09-21: Dockerfile 이 docs/ 를 안 넣어 배포 빌드가 통째로 실패했다.)
            logger.lifecycle('goldenAuditStamp: docs/testing.md 가 없어 개수를 심지 않는다')
            out.text = "stampedAt=${new Date().format('yyyy-MM-dd')}\n"
            return
        }
        def cases = source.readLines().count { it.startsWith('## G-') }
        out.text = "cases=${cases}\nstampedAt=${new Date().format('yyyy-MM-dd')}\n"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// docs/testing.md "기준" 절이 pricing 분기 100%·라인 90%, detection 라인 80% 를 요구해 왔지만
// 재는 도구가 없어 한 번도 검증되지 않았다(2026-09-17 확인). 기준을 빌드가 강제하게 한다.
jacocoTestReport {
    dependsOn tasks.named('test')
    reports { xml.required = true; html.required = true }
}
tasks.named('test') { finalizedBy tasks.named('jacocoTestReport') }

// 기준의 출처는 docs/testing.md "기준" 절이다. 숫자를 여기서 새로 정하지 않는다 —
// 문서가 계약이고 이 블록은 그 계약을 빌드가 지키게 하는 장치다.
jacocoTestCoverageVerification {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.palsaekjo.yogobi.pricing', 'com.palsaekjo.yogobi.pricing.*']
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 1.00 }
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.90 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.palsaekjo.yogobi.detection', 'com.palsaekjo.yogobi.detection.*']
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 1.00 }
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.90 }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('jacocoTestCoverageVerification') }
