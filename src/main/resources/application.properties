spring.application.name=yogobi
spring.config.import=optional:file:.env[.properties]
# sslmode 기본 disable: Fly 내부 Postgres는 사설망(이미 암호화)이라 SSL 미지원. SSL 필요한 PG면 POSTGRES_SSLMODE=require
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:yogobi}?sslmode=${POSTGRES_SSLMODE:disable}
spring.datasource.username=${POSTGRES_USER:yogobi}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.sql.init.mode=never

# 날짜 경계는 한국시간이다(2026-09-21). 서버는 UTC 라 CURRENT_DATE 가 UTC 날짜였고,
# KST 00:00~09:00 의 활동이 전날로 찍혔다 — 국내 서비스의 "오늘 몇 명"이 9시간 어긋난다.
# 세션 시간대를 옮기면 CURRENT_DATE · now() · timestamp→timestamptz 캐스트가 한 번에 맞는다.
# 쿼리마다 AT TIME ZONE 을 흩뿌리면 새로 쓰는 쿼리가 빠뜨린다. 여기 한 줄이 유일한 지점이다.
# 저장값은 TIMESTAMPTZ(절대 시각)이라 바뀌지 않는다. 바뀌는 것은 날짜를 어디서 자르느냐다.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'

# 쿠키 인증용 정확한 CORS 오리진. 운영은 프론트 HTTPS 오리진만 지정한다(wildcard 금지).
yogobi.cors.allowed-origins=${YOGOBI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://yogob.fly.dev}
yogobi.auth.secure-cookies=${AUTH_SECURE_COOKIES:true}
yogobi.auth.google-enabled=${GOOGLE_AUTH_ENABLED:false}
yogobi.auth.return-url=${AUTH_RETURN_URL:http://localhost:5173/}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTH_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=${AUTH_SESSION_COOKIE_NAME:__Host-YGB_SESSION}
server.servlet.session.timeout=5m


# 운영 지표(D-25). 액추에이터는 공개 포트(8080)가 아니라 9091 에만 뜬다 — Fly 는 8080 하나만 프록시하므로
# 지표·헬스는 사설망(6PN)에서만 닿는다. 공개했다면 회원 수와 내부 경로 목록이 그대로 새어 나간다.
management.server.port=${MANAGEMENT_PORT:9091}
management.endpoints.web.exposure.include=health,prometheus
# 요금제 전량 목록이 약 370KB 로 다섯 화면에서 받는다 — 압축해서 보낸다(G-82 b). JSON 만, 2KB 이상만.
# TLS 는 Fly 프록시가 끝낸다. 신뢰하는 내부 프록시(사설 대역)의 X-Forwarded-* 를 읽어야 요청이 https 로 보이고
# Spring Security 가 HSTS 를 보낸다(G-89 a). 같이 TCP 발신지도 Fly 가 붙인 실제 주소로 바뀐다 — 맨 오른쪽의
# 신뢰하지 않는 주소를 쓰므로 클라이언트가 앞에 지어 넣은 X-Forwarded-For 는 무시된다.
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048
# G-85 d. DB 가 느리거나 멈추면 요청이 30초(기본) 매달렸다 — 헬스체크(5초)보다 먼저 포기한다.
spring.datasource.hikari.connection-timeout=5000
# DB 머신은 256MB 다. 연결마다 Postgres 백엔드 프로세스가 생기는데, 배포(blue-green) 중엔 BE 가 두 대라 기본 10개씩
# 20개가 붙어 DB 가 자원 한계에 닿고 HAProxy 가 모든 연결을 끊었다(2026-10-01 05:41 운영 로그, G-91).
# 요청은 0.2초대라 5개면 충분하고, 쉬는 동안엔 1개만 남긴다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# G-85 g. 제약 위반 메시지에 행 값(이메일·닉네임)을 싣지 않는다 — 로그로 새지 않게.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# G-85 c. DB 가 잠깐 없을 때 기동이 한 번에 죽지 않는다(2026-09-27 장애). 6회 × 10초.
spring.flyway.connect-retries=6
spring.flyway.connect-retries-interval=10s
