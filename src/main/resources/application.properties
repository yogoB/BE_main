spring.application.name=yogobi
spring.config.import=optional:file:.env[.properties]
# sslmode 기본 disable: Fly 내부 Postgres는 사설망(이미 암호화)이라 SSL 미지원. SSL 필요한 PG면 POSTGRES_SSLMODE=require
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:yogobi}?sslmode=${POSTGRES_SSLMODE:disable}
spring.datasource.username=${POSTGRES_USER:yogobi}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.sql.init.mode=never

# 쿠키 인증용 정확한 CORS 오리진. 운영은 프론트 HTTPS 오리진만 지정한다(wildcard 금지).
yogobi.cors.allowed-origins=${YOGOBI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://yogob.fly.dev}
yogobi.auth.secure-cookies=${AUTH_SECURE_COOKIES:true}
yogobi.auth.google-enabled=${GOOGLE_AUTH_ENABLED:false}
yogobi.auth.return-url=${AUTH_RETURN_URL:http://localhost:5173/}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTH_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=${AUTH_SESSION_COOKIE_NAME:__Host-YGB_SESSION}
server.servlet.session.timeout=5m

yogobi.auth.email-enabled=${AUTH_EMAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 운영 지표(D-25). 액추에이터는 공개 포트(8080)가 아니라 9091 에만 뜬다 — Fly 는 8080 하나만 프록시하므로
# 지표·헬스는 사설망(6PN)에서만 닿는다. 공개했다면 회원 수와 내부 경로 목록이 그대로 새어 나간다.
management.server.port=${MANAGEMENT_PORT:9091}
management.endpoints.web.exposure.include=health,prometheus
