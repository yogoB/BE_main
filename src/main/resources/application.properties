spring.application.name=yogobi
spring.config.import=optional:file:.env[.properties]
# sslmode 기본 disable: Fly 내부 Postgres는 사설망(이미 암호화)이라 SSL 미지원. SSL 필요한 PG면 POSTGRES_SSLMODE=require
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:yogobi}?sslmode=${POSTGRES_SSLMODE:disable}
spring.datasource.username=${POSTGRES_USER:yogobi}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.sql.init.mode=never

# CORS 허용 오리진(쉼표 구분). 로컬 dev + 배포 오리진(백엔드가 목업을 같은 오리진에 서빙하므로 자기 도메인도 필요 —
# Fly 프록시 뒤라 same-origin 이 CORS 검사를 타서 403 이 난다). 프론트 배포 도메인은 YOGOBI_CORS_ALLOWED_ORIGINS 로 주입.
yogobi.cors.allowed-origins=http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://yogob.fly.dev
