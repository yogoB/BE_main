<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
<title>요고비 · 내 계정</title>
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:48px auto;padding:0 24px;color:#182333;background:#f8fafc;line-height:1.6}a{color:#1859ad}section{margin:24px 0;padding:24px;background:white;border:1px solid #dbe2eb;border-radius:12px}h1,h2{line-height:1.3}h2{font-size:1.2rem}label{display:block;margin-top:12px}input,select,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #8a98aa;box-sizing:border-box}input,select{width:100%}button{margin-top:16px;background:#1859ad;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #efb545;outline-offset:3px}#message{min-height:2em;white-space:pre-wrap}li{margin:16px 0;overflow-wrap:anywhere}li button{display:block}[hidden]{display:none!important}
</style>
<main>
<a href="/">요고비 홈</a><h1>내 계정</h1>
<p>추천과 비용 계산은 로그인 없이 이용할 수 있어요.</p>
<p id="message" role="status" aria-live="polite"></p>
<section id="confirmation" hidden>
<h2 id="confirmation-title">비밀번호 설정</h2>
<form id="confirm-form">
<label for="new-password">새 비밀번호</label><input id="new-password" type="password" autocomplete="new-password" minlength="15" required aria-describedby="password-help">
<p id="password-help">15자 이상으로 입력해 주세요. 한글 등을 포함하면 최대 길이가 달라질 수 있어요(72바이트 이내).</p>
<label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" type="password" autocomplete="new-password" required>
<button type="submit">확인하고 완료</button>
</form></section>
<section id="login-section"><h2>로그인</h2>
<form id="login-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">로그인</button></form>
<p><a href="/oauth2/authorization/google">Google로 계속하기</a></p></section>
<section id="mail-section"><h2>가입 · 비밀번호 찾기</h2>
<form id="mail-form"><label for="mail-action">원하는 작업</label><select id="mail-action"><option value="verification">새로 가입하기</option><option value="reset-request">비밀번호 재설정</option></select>
<label for="mail-email">본인 이메일</label><input id="mail-email" type="email" autocomplete="email" maxlength="254" required>
<button type="submit">본인 확인 메일 받기</button></form></section>
<section id="member" hidden><h2>로그인한 계정</h2><p id="member-email"></p>
<p>15분이 지나거나 5분 동안 이용하지 않으면 다시 로그인해 주세요.</p>
<form id="link-form" hidden><label id="link-label" for="link-password">비밀번호 재확인</label><input id="link-password" type="password" required>
<button id="link-button" type="submit">Google 계정 연결</button></form>
<h2>현재 로그인 목록</h2><p>브라우저 정보와 로그인 시간을 확인하고 모르는 세션을 종료하세요.</p><ul id="sessions"></ul>
<button id="logout" type="button">로그아웃</button> <button id="logout-all" type="button">모두 로그아웃</button></section>
</main>
<script src="/account.js" defer></script>
</html>
